spring:
  application:
    name: finthos
  docker:
    compose:
      enabled: true
  datasource:
    url: ${FINTHOS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finthos}
    username: ${FINTHOS_DATASOURCE_USERNAME:finthos}
    password: ${FINTHOS_DATASOURCE_PASSWORD:finthos}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    jdbc:
      repositories:
        enabled: true

finthos:
  jwt:
    secret: "dev-only-secret-key-change-me-in-production-0123456789abcdef"
    expiration-ms: 3600000

logging:
  level:
    org.zalando.logbook: TRACE
    com.alahly.momkn.finthos.common.logging: TRACE

logbook:
  format:
    style: json

processor:
  base-url: http://localhost:8072
  timeout-ms: 2000
  retry-count: 3
  retry-delay-ms: 500

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
    instances:
      processor:
        base-config: default
