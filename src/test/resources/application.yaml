spring:
  datasource:
    # Real PostgreSQL via Testcontainers (Docker required). TC_DAEMON keeps one container
    # alive for the whole test JVM, shared by every Spring test context.
    url: jdbc:tc:postgresql:16:///finthos?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    locations: classpath:db/migration

finthos:
  jwt:
    secret: "dev-only-secret-key-change-me-in-production-0123456789abcdef"
    expiration-ms: 3600000

logbook:
  http:
    sender:
      mode: test

processor:
  base-url: http://localhost:9090
  timeout-ms: 2000
  retry-count: 3
  retry-delay-ms: 100

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        wait-duration-in-open-state: 1s
        permitted-number-of-calls-in-half-open-state: 2
        minimum-number-of-calls: 3
    instances:
      processor:
        base-config: default
