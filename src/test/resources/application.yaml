spring:
  datasource:
    url: jdbc:h2:mem:finthos;MODE=PostgreSQL;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    locations: classpath:db/migration

finthos:
  jwt:
    secret: "dev-only-secret-key-change-me-in-production-0123456789abcdef"
    expiration-ms: 3600000

logbook:
  http:
    sender:
      mode: test

processor:
  base-url: http://localhost:9090
  timeout-ms: 2000
  retry-count: 3
  retry-delay-ms: 100

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        wait-duration-in-open-state: 1s
        permitted-number-of-calls-in-half-open-state: 2
        minimum-number-of-calls: 3
    instances:
      processor:
        base-config: default
