# Everything: `docker compose up --build` starts PostgreSQL, Adminer and the app.
#
#   APP_PORT            host port for the app (default 8080)
#   PROCESSOR_BASE_URL  payment processor (default: SoapUI mock on the host, port 8072)
#   FINTHOS_JWT_SECRET  overrides the dev JWT secret
#
# With the bundled mock processor instead of SoapUI:
#   PROCESSOR_BASE_URL=http://mock-processor:18072 docker compose --profile mock up --build
name: finthos

include:
  - compose.db.yaml

services:
  app:
    build: .
    image: finthos-app
    container_name: finthos-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      FINTHOS_DATASOURCE_URL: jdbc:postgresql://db:5432/finthos
      PROCESSOR_BASE_URL: ${PROCESSOR_BASE_URL:-http://host.docker.internal:8072}
      FINTHOS_JWT_SECRET: ${FINTHOS_JWT_SECRET:-dev-only-secret-key-change-me-in-production-0123456789abcdef}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach SoapUI on the host (Linux too)

  mock-processor:
    image: node:20-alpine
    container_name: finthos-mock-processor
    profiles: ["mock"]
    command: ["node", "/mock/mock-processor.js", "18072"]
    volumes:
      - ./postman/mock-processor.js:/mock/mock-processor.js:ro
    ports:
      - "18072:18072"
