# Infrastructure only (PostgreSQL + Adminer).
# - `./mvnw spring-boot:run` starts just this file (spring.docker.compose.file in application.yaml),
#   so a local run never starts the app container as well.
# - docker-compose.yaml includes this file and adds the app.
name: finthos

services:
  db:
    image: postgres:16
    container_name: finthos-db
    restart: no
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: finthos
      POSTGRES_USER: finthos
      POSTGRES_PASSWORD: finthos
    volumes:
      - finthos-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finthos -d finthos"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: finthos-adminer
    restart: unless-stopped
    ports:
      - "8888:8080"
    depends_on:
      - db

volumes:
  finthos-db-data:
